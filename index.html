<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bober Bros makes indie horror games. Play Last Pill Bar, Happy House, and more on Steam.">
<title>Bober Bros</title>
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
<link rel="preload" as="image" href="games/LastPillBar/cover.webp" type="image/webp" fetchpriority="high">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LR3D98X0W1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-LR3D98X0W1');

<style>
/* ---------- Global ---------- */
html,body{margin:0;background:#0a0a0a;color:#f0f0f0;font-family:Arial,Helvetica,sans-serif;}
a{color:inherit;text-decoration:none}
h1{position:relative;overflow:hidden;font-family:Impact,"Arial Black",sans-serif;letter-spacing:2px;font-size:3rem;margin:0;padding:2rem 0;text-align:center;background-color:#111;background-image:radial-gradient(rgba(255,255,255,.08) .7px,transparent .7px);background-size:4px 4px;}
/* ---------- Game grid ---------- */
#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2rem;max-width:1100px;margin:3rem auto;padding:0 1rem;}
.card{position:relative;aspect-ratio:374/448;overflow:hidden;border:3px solid #333;border-radius:12px;box-shadow:0 0 20px rgba(255,0,0,.3);}
a.card{cursor:pointer;transition:transform .3s;}
@media (hover:hover){a.card:hover{transform:scale(1.04);}}
.card picture,.card img{width:100%;height:100%;display:block;}
.card img{object-fit:cover;}
.card--loading{background:#181818;}
.card__status{position:absolute;right:.7rem;bottom:.7rem;max-width:calc(100% - 1.4rem);padding:.35rem .55rem;background:#0a0a0a;color:#f0f0f0;border:1px solid #f0f0f0;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.card--placeholder{border-color:#b22222;}
.gallery-error{grid-column:1/-1;text-align:center;}
/* ---------- Social bar ---------- */
#socials{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1.2rem;margin:4rem 0 2rem;padding:0 1rem;}
#socials a{flex:0 0 auto;width:clamp(28px,8vw,32px);height:clamp(28px,8vw,32px);display:inline-block;transition:transform .2s;}
#socials a.patreon{width:clamp(34px,10vw,40px);height:clamp(34px,10vw,40px);}
#socials img{width:100%;height:100%;filter:invert(1) grayscale(.3) brightness(1.3);transition:filter .2s;}
@media (hover:hover){#socials a:hover{transform:scale(1.06);}#socials a:hover img{filter:invert(1);}}
@media (max-width:420px){#socials{gap:1rem;margin:3rem 0 1.5rem;}}
/* ---------- Glitch ---------- */
@keyframes glitch{0%{clip-path:inset(0 0 70% 0);}33%{clip-path:inset(20% 0 40% 0);}66%{clip-path:inset(60% 0 10% 0);}100%{clip-path:inset(0 0 70% 0);}}
h1::after{content:attr(data-glitch);position:absolute;inset:0;color:#f00;pointer-events:none;mix-blend-mode:hard-light;animation:glitch 2s infinite;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}}
</style>
</head>

<body>
<h1 data-glitch="Bober Bros">Bober Bros</h1>

<main>
  <section id="gallery" aria-live="polite"></section>
</main>

<footer id="socials">
  <a target="_blank" rel="noopener noreferrer" href="https://www.patreon.com/c/SuperBoberBros" class="patreon">
    <img src="assets/icons/patreon.svg" alt="Patreon" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://discord.gg/YEYERAF7cC">
    <img src="assets/icons/discord.svg" alt="Discord" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://store.steampowered.com/developer/SUPERBOBERBROS">
    <img src="assets/icons/steam.svg" alt="Steam" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/@superboberbros">
    <img src="assets/icons/youtube.svg" alt="YouTube" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://x.com/SuperBoberBros">
    <img src="assets/icons/twitter.svg" alt="X" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://www.tiktok.com/@bober.bros">
    <img src="assets/icons/tiktok.svg" alt="TikTok" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://www.instagram.com/superboberbros/">
    <img src="assets/icons/instagram.svg" alt="Instagram" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://bsky.app/profile/superboberbros.bsky.social">
    <img src="assets/icons/bluesky.svg" alt="Bluesky" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://www.reddit.com/r/BoberBros/">
    <img src="assets/icons/reddit.svg" alt="Reddit" loading="lazy" decoding="async">
  </a>
  <a target="_blank" rel="noopener noreferrer" href="https://t.me/superboberbros">
    <img src="assets/icons/telegram.svg" alt="Telegram" loading="lazy" decoding="async">
  </a>
</footer>

<script>
const gallery = document.getElementById("gallery");

function renderGames(games) {
  gallery.replaceChildren();

  games.forEach((game, index) => {
    const card = document.createElement(game.url ? "a" : "article");
    card.className = `card${game.status ? " card--placeholder" : ""}`;

    if (game.url) {
      card.href = game.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
    }

    const picture = document.createElement("picture");
    const source = document.createElement("source");
    source.srcset = `games/${game.folder}/${game.cover}`;
    source.type = "image/webp";

    const cover = document.createElement("img");
    cover.src = `games/${game.folder}/${game.cover.replace(".webp", ".jpg")}`;
    cover.alt = game.title;
    cover.width = 374;
    cover.height = 448;
    cover.loading = index === 0 ? "eager" : "lazy";
    cover.decoding = "async";
    if (index === 0) cover.fetchPriority = "high";
    picture.append(source, cover);
    card.appendChild(picture);

    if (game.status) {
      const status = document.createElement("span");
      status.className = "card__status";
      status.textContent = game.status;
      card.appendChild(status);
    }

    gallery.appendChild(card);
  });

  gallery.setAttribute("aria-busy", "false");
}

function renderLoadingCards(count) {
  for (let index = 0; index < count; index += 1) {
    const card = document.createElement("div");
    card.className = "card card--loading";
    card.setAttribute("aria-hidden", "true");
    gallery.appendChild(card);
  }
}

renderLoadingCards(7);

fetch("games.json")
  .then(response => response.ok ? response.json() : Promise.reject(response))
  .then(data => renderGames(data.games))
  .catch(() => {
    gallery.replaceChildren();
    const error = document.createElement("p");
    error.className = "gallery-error";
    error.textContent = "The game list could not load. Please refresh.";
    gallery.appendChild(error);
    gallery.setAttribute("aria-busy", "false");
  });
</script>
</body>
</html>
